name: checks

on:
  push:
    branches:
      - '**'

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: links
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: links
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U links"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://links:secret@localhost:5432/links?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Migrate the test database
        run: go tool goose -dir ./db/migrations postgres "$TEST_DATABASE_URL" up

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
